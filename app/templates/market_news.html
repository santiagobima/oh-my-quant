{% extends "base.html" %}

{% block title %}Market News · Oh My Quant{% endblock %}

{% block content %}
  <h2 class="mb-4">📰 Keep and Eye on the latest market news</h2>

  <ul class="list-group">
    {% for article in articles %}
      <li class="list-group-item">
        <a href="{{ article.link }}" target="_blank">{{ article.title }}</a>
      </li>
    {% endfor %}
  </ul>

  <p class="mt-4">
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-light">⬅ Back to Dashboard</a>
  </p>
{% endblock %}
