{% extends "base.html" %}

{% block title %}Fetching Data · Oh My Quant{% endblock %}

{% block content %}
  <div class="text-center mt-5">
    <h2>⏳ Fetching latest market data...</h2>
    <p>This may take a few seconds. You will be redirected automatically.</p>
    <div class="spinner-border text-primary mt-3" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Meta refresh: vuelve al dashboard en 2 segundos -->
  <meta http-equiv="refresh" content="10;url={{ url_for('main.dashboard') }}">
{% endblock %}
